name: Publish trail-cam photos

on:
  push:
    branches: [main]
    paths: ["uploads/inbox/**", "docs/edits.json", "archive.json"]   # new uploads, owner edits, archive settings
  schedule:
    - cron: "23 * * * *"        # every hour (UTC) - checks Reveal if set up
  workflow_dispatch:               # "Run workflow" button on the Actions tab
    inputs:
      debug:
        description: "Save a screenshot of the Reveal page (may show your email)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_REVEAL: ${{ secrets.REVEAL_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      # Optional: only runs if you added REVEAL_EMAIL / REVEAL_PASSWORD secrets.
      - name: Download new photos from Reveal
        if: ${{ env.HAS_REVEAL == 'true' }}
        env:
          REVEAL_EMAIL: ${{ secrets.REVEAL_EMAIL }}
          REVEAL_PASSWORD: ${{ secrets.REVEAL_PASSWORD }}
          REVEAL_LOGIN_URL: ${{ vars.REVEAL_LOGIN_URL || 'https://account.revealcellcam.com' }}
          REVEAL_GALLERY_URL: ${{ vars.REVEAL_GALLERY_URL }}
          REVEAL_DEBUG: ${{ inputs.debug && '1' || '0' }}
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python scripts/fetch_reveal.py
        continue-on-error: true

      - name: Publish photos (strip GPS, resize, update gallery, apply removals)
        run: python scripts/import_photos.py

      # Off until archive.json says "enabled": true. Zips older photos into a
      # GitHub release first, and only then removes them from the site.
      - name: Archive older photos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/archive_photos.py prepare
          if [ -f build/archive.zip ]; then
            tag="photos-archive-$(date -u +%Y%m%d-%H%M)"
            gh release create "$tag" build/archive.zip --title "Photo archive $(date -u +%F)" --notes-file build/archive-notes.md
            python scripts/archive_photos.py finalize
          fi

      - name: Commit changes
        run: |
          git config user.name  "whitetail-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs uploads
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Publish trail-cam photos ($(date -u +%F))"
            # Owner edits saved from the website while this ran are kept.
            git pull --rebase origin main
            git push || { sleep 10; git pull --rebase origin main; git push; }
          fi

      - name: Save Reveal debug info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reveal-debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
